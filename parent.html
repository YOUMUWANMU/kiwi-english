<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>家长后台 · Kiwi English</title>
<script src="auth.js?v=3.4"></script>
<style>
  :root {
    --kiwi: #3d7a3a; --kiwi-light: #e8f5e8; --kiwi-dark: #2a5528;
    --sky: #2563a8; --sky-light: #e8f0fb;
    --fern: #5a9e57;
    --gold: #c8820a; --gold-light: #fef3dc;
    --danger: #c0392b; --danger-light: #fde8e8;
    --bg: #f7f8f5; --surface: #ffffff;
    --text: #1a1f17; --text-2: #4a5245; --text-3: #7a8475;
    --border: #dde3d8; --radius: 12px; --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:40px; }

  .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20; }
  .logo { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; color:var(--kiwi-dark); text-decoration:none; }
  .logo-icon { width:30px; height:30px; background:var(--kiwi); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .role-badge { background:var(--gold-light); color:#7a5a0a; font-size:11px; font-weight:500; padding:3px 8px; border-radius:10px; border:1px solid #f5d89a; }
  .top-spacer { flex:1; }
  .logout-btn { background:transparent; border:none; color:var(--text-3); font-size:13px; cursor:pointer; padding:6px 10px; border-radius:var(--radius-sm); }
  .logout-btn:hover { color:var(--danger); background:var(--danger-light); }

  /* 孩子切换 */
  .kid-switcher { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
  .kid-switcher::-webkit-scrollbar { display:none; }
  .kid-chip { display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--bg); border:1px solid var(--border); border-radius:24px; cursor:pointer; transition:all .15s; flex-shrink:0; }
  .kid-chip:hover { border-color:var(--fern); }
  .kid-chip.active { background:var(--kiwi); border-color:var(--kiwi); color:#fff; }
  .kid-chip-avatar { font-size:22px; line-height:1; }
  .kid-chip-name { font-size:13px; font-weight:500; }
  .add-kid-chip { display:flex; align-items:center; gap:6px; padding:8px 14px; background:transparent; border:1px dashed var(--border); border-radius:24px; color:var(--text-3); font-size:13px; cursor:pointer; flex-shrink:0; }
  .add-kid-chip:hover { border-color:var(--kiwi); color:var(--kiwi-dark); }

  .content { max-width:760px; margin:0 auto; padding:18px 16px 0; }

  /* hero卡片 */
  .hero-card { background:var(--kiwi-dark); color:#fff; border-radius:var(--radius); padding:22px; margin-bottom:14px; }
  .hero-row { display:flex; align-items:center; gap:14px; }
  .hero-avatar { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:36px; flex-shrink:0; }
  .hero-name { font-size:18px; font-weight:600; margin-bottom:4px; }
  .hero-sub { font-size:12px; color:#b8d9b6; }
  .hero-stats { display:flex; gap:16px; margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.15); }
  .hero-stat { flex:1; }
  .hero-stat-num { font-size:22px; font-weight:700; line-height:1; margin-bottom:4px; }
  .hero-stat-label { font-size:11px; color:#9fd49c; }
  .streak-badge { background:rgba(248,200,80,.2); color:#f8c850; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; display:inline-flex; align-items:center; gap:3px; margin-top:4px; }

  /* 模块卡片网格 */
  .modules-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  @media (max-width: 600px) { .modules-grid { grid-template-columns:1fr; } }
  .mod-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .mod-card-icon { font-size:22px; margin-bottom:6px; }
  .mod-card-label { font-size:11px; color:var(--text-3); font-weight:500; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .mod-card-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:10px; }
  .mod-card-stat { display:flex; align-items:baseline; gap:6px; margin-bottom:4px; }
  .mod-card-num { font-size:20px; font-weight:700; color:var(--kiwi-dark); line-height:1; }
  .mod-card-unit { font-size:11px; color:var(--text-3); }
  .mod-card-sub { font-size:11px; color:var(--text-2); margin-top:6px; }

  /* 趋势图卡片 */
  .panel-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  .panel-title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .panel-title-sub { font-size:12px; font-weight:400; color:var(--text-3); }

  .trend-chart { height:160px; position:relative; padding-top:10px; }
  .trend-bars { display:flex; height:130px; align-items:flex-end; gap:8px; padding:0 4px; }
  .trend-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .trend-bar { width:100%; max-width:36px; background:var(--kiwi); border-radius:4px 4px 0 0; min-height:2px; position:relative; transition:opacity .15s; }
  .trend-bar:hover { opacity:.7; }
  .trend-bar-empty { background:var(--border); }
  .trend-bar-value { font-size:10px; color:var(--text-3); margin-bottom:2px; }
  .trend-label { font-size:10px; color:var(--text-3); }
  .trend-label.today { color:var(--kiwi); font-weight:600; }

  /* 错误列表 */
  .errors-list { display:flex; flex-direction:column; gap:8px; }
  .error-row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--gold-light); border:1px solid #f5d89a; border-radius:var(--radius-sm); }
  .error-icon { font-size:14px; flex-shrink:0; }
  .error-pattern { flex:1; font-size:13px; color:#7a5a0a; font-family:'SF Mono','Menlo',monospace; }
  .error-count { font-size:12px; font-weight:600; color:#7a5a0a; background:#fff; padding:2px 8px; border-radius:10px; flex-shrink:0; }
  .empty-msg { text-align:center; padding:24px 12px; color:var(--text-3); font-size:13px; }

  /* 训练设置 */
  .settings-area { display:flex; flex-direction:column; gap:18px; }
  .setting-block { display:flex; flex-direction:column; gap:8px; }
  .setting-label { font-size:13px; font-weight:600; color:var(--text); }
  .setting-desc { font-size:11px; color:var(--text-3); line-height:1.5; }
  .setting-options { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:4px; }
  @media (max-width: 600px) { .setting-options { grid-template-columns:1fr; } }
  .setting-opt { padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); cursor:pointer; transition:all .15s; }
  .setting-opt:hover { border-color:var(--fern); }
  .setting-opt.active { background:var(--kiwi-light); border-color:var(--kiwi); }
  .setting-opt-title { font-size:13px; font-weight:500; color:var(--text); margin-bottom:3px; }
  .setting-opt.active .setting-opt-title { color:var(--kiwi-dark); }
  .setting-opt-desc { font-size:11px; color:var(--text-3); line-height:1.4; }
  .setting-save-row { display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:6px; padding-top:14px; border-top:1px solid var(--border); }
  .setting-save-status { font-size:12px; }
  .setting-save-btn { padding:9px 18px; background:var(--kiwi); color:#fff; border:none; border-radius:var(--radius-sm); font-size:13px; font-weight:500; cursor:pointer; }
  .setting-save-btn:hover { background:var(--kiwi-dark); }

  /* 阶段下拉 */
  .stage-select-wrap { display:flex; flex-direction:column; gap:8px; }
  .stage-select { width:100%; padding:11px 14px; font-size:14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-family:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%237a8475%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat:no-repeat; background-position:right 12px center; background-size:10px; padding-right:36px; }
  .stage-select:focus { outline:none; border-color:var(--kiwi); background-color:#fff; }
  .curriculum-link { display:inline-block; font-size:12px; color:var(--kiwi); text-decoration:none; font-weight:500; align-self:flex-start; }
  .curriculum-link:hover { text-decoration:underline; }

  /* 通关进度条 */
  .warn-tip { font-size:11px; color:#7a5a0a; background:var(--gold-light); border:1px solid #f5d89a; padding:8px 10px; border-radius:6px; margin-top:6px; }

  .gate-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width: 600px) { .gate-grid { grid-template-columns:1fr; } }
  .gate-item { padding:9px 12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .gate-item.gate-ok { background:var(--kiwi-light); border-color:#b8d9b6; }
  .gate-item-label { font-size:12px; color:var(--text-2); font-weight:500; }
  .gate-item.gate-ok .gate-item-label { color:var(--kiwi-dark); }
  .gate-item-val { font-size:12px; font-weight:600; color:var(--text-3); }
  .gate-item.gate-ok .gate-item-val { color:var(--kiwi-dark); }

  .gate-summary { font-size:12px; padding:10px 12px; border-radius:var(--radius-sm); margin-top:10px; }
  .gate-summary-ok { background:var(--kiwi-light); border:1px solid #b8d9b6; color:var(--kiwi-dark); font-weight:500; }
  .gate-summary-pending { background:var(--bg); border:1px solid var(--border); color:var(--text-3); }

  .advance-card { background:var(--gold-light); border:2px solid var(--gold); border-radius:var(--radius-sm); padding:14px; margin-top:12px; }

  /* 补习期卡片 */
  .remediation-card { background:#f0e8fb; border:1px solid #d4c2eb; border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:12px; }
  .remediation-card.remediation-urgent { background:#fbe8e8; border-color:#f5c0c0; }
  .remediation-title { font-size:13px; font-weight:600; color:#5d4a85; margin-bottom:4px; }
  .remediation-card.remediation-urgent .remediation-title { color:var(--danger); }
  .remediation-sub { font-size:12px; color:var(--text-2); line-height:1.5; }

  /* 原版书打卡 */
  .panel-sub { font-size:12px; color:var(--text-3); line-height:1.5; margin:0 0 12px; }
  .book-list { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .book-row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
  .book-icon { font-size:18px; flex-shrink:0; }
  .book-meta { flex:1; min-width:0; }
  .book-title { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .book-sub { font-size:11px; color:var(--text-3); margin-top:2px; }
  .book-count { font-size:11px; color:var(--kiwi); font-weight:500; background:var(--kiwi-light); padding:2px 8px; border-radius:10px; flex-shrink:0; }
  .book-del { background:transparent; border:none; color:var(--text-3); font-size:14px; cursor:pointer; padding:4px 6px; flex-shrink:0; }
  .book-del:hover { color:var(--danger); }
  .add-book-btn { width:100%; padding:11px; background:transparent; border:1.5px dashed var(--border); border-radius:8px; color:var(--text-2); font-size:13px; cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .add-book-btn:hover { background:var(--kiwi-light); border-color:var(--kiwi); color:var(--kiwi); }
  /* 添加书 modal */
  .book-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .book-modal.show { display:flex; }
  .book-modal-card { background:var(--surface); border-radius:16px; max-width:420px; width:100%; padding:22px; }
  .book-modal-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:14px; }
  .book-field { margin-bottom:12px; }
  .book-field-label { display:block; font-size:12px; color:var(--text-2); margin-bottom:5px; font-weight:500; }
  .book-field-input, .book-field-select { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-size:13px; font-family:inherit; background:var(--bg); color:var(--text); box-sizing:border-box; }
  .book-field-input:focus, .book-field-select:focus { outline:none; border-color:var(--kiwi); }
  .book-modal-actions { display:flex; gap:8px; margin-top:18px; }
  .book-modal-btn { flex:1; padding:11px; border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit; border:none; font-weight:600; }
  .book-modal-btn-primary { background:var(--kiwi); color:white; }
  .book-modal-btn-secondary { background:transparent; border:1px solid var(--border); color:var(--text-2); }
  /* Tab 切换 */
  .book-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  .book-tab { flex:1; background:transparent; border:none; padding:9px; font-size:12px; cursor:pointer; color:var(--text-3); font-family:inherit; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .book-tab.active { color:var(--kiwi); border-bottom-color:var(--kiwi); font-weight:600; }
  .book-tab:hover:not(.active) { color:var(--text-2); }
  /* 推荐书单 */
  .book-rec-hint { font-size:11px; color:var(--text-2); line-height:1.6; margin-bottom:10px; padding:8px 10px; background:var(--bg); border-radius:6px; }
  .book-rec-list { max-height:380px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .book-rec-card { padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all 0.12s; }
  .book-rec-card:hover { border-color:var(--kiwi); background:var(--kiwi-light); }
  .book-rec-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .book-rec-title { font-size:13px; font-weight:600; color:var(--text); line-height:1.3; flex:1; min-width:0; }
  .book-rec-lexile { font-size:10px; color:var(--text-3); font-weight:500; background:white; padding:2px 8px; border-radius:8px; flex-shrink:0; white-space:nowrap; }
  .book-rec-author { font-size:11px; color:var(--text-3); margin-top:2px; }
  .book-rec-award { font-size:10px; color:var(--gold); font-weight:600; margin-top:3px; }
  .book-rec-blurb { font-size:11px; color:var(--text-2); margin-top:5px; line-height:1.5; }
  .book-rec-why { font-size:10px; color:var(--kiwi-dark); margin-top:3px; line-height:1.5; font-style:italic; }
  .advance-card-title { font-size:14px; font-weight:600; color:#7a5a0a; margin-bottom:4px; }
  .advance-card-sub { font-size:12px; color:#7a5a0a; margin-bottom:10px; line-height:1.5; }
  .advance-btn { width:100%; padding:11px; background:var(--gold); color:#fff; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600; cursor:pointer; }
  .advance-btn:hover { background:#a36807; }

  /* 模块分布 */
  .distribution { display:flex; height:32px; border-radius:8px; overflow:hidden; background:var(--bg); margin-bottom:10px; }
  .dist-seg { display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:500; transition:opacity .15s; }
  .dist-seg:hover { opacity:.85; }
  .dist-listening { background:var(--sky); }
  .dist-speaking { background:var(--kiwi); }
  .dist-writing { background:var(--gold); }
  .dist-legend { display:flex; gap:14px; font-size:11px; color:var(--text-2); flex-wrap:wrap; }
  .dist-legend-item { display:flex; align-items:center; gap:5px; }
  .dist-dot { width:9px; height:9px; border-radius:50%; }

  .loading-screen { text-align:center; padding:60px 20px; color:var(--text-3); }

  /* 添加孩子弹窗 */
  .modal-mask { display:none; position:fixed; inset:0; background:rgba(26,31,23,0.6); z-index:50; align-items:center; justify-content:center; padding:16px; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--surface); border-radius:var(--radius); padding:22px; max-width:380px; width:100%; max-height:90vh; overflow-y:auto; }
  .modal-title { font-size:16px; font-weight:600; margin-bottom:14px; }
  .field { margin-bottom:12px; }
  .field-label { font-size:12px; font-weight:500; color:var(--text-2); margin-bottom:6px; }
  input[type=text] { width:100%; padding:11px 14px; font-size:14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); outline:none; font-family:inherit; color:var(--text); }
  input:focus { border-color:var(--kiwi); background:#fff; }
  .avatar-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .avatar-btn { aspect-ratio:1; border:2px solid var(--border); border-radius:50%; background:var(--bg); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .avatar-btn.selected { border-color:var(--kiwi); background:var(--kiwi-light); }
  .pin-row { display:flex; gap:8px; justify-content:center; }
  .pin-box { width:46px; height:50px; border:1px solid var(--border); border-radius:var(--radius-sm); text-align:center; font-size:20px; font-weight:600; background:var(--bg); }
  .modal-actions { display:flex; gap:8px; margin-top:14px; }
  .btn-cancel { flex:1; padding:11px; background:var(--bg); border:1px solid var(--border); color:var(--text-2); border-radius:var(--radius-sm); font-size:14px; cursor:pointer; }
  .btn-submit { flex:1; padding:11px; background:var(--kiwi); color:#fff; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:500; cursor:pointer; }
  .error-msg { color:var(--danger); font-size:13px; background:var(--danger-light); border:1px solid #f5c0b8; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:12px; display:none; }
  .error-msg.show { display:block; }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="parent.html">
    <div class="logo-icon">🥝</div>
    Kiwi English
  </a>
  <span class="role-badge">家长视角</span>
  <div class="top-spacer"></div>
  <button class="logout-btn" onclick="KIWI.logout()">退出</button>
</div>

<div class="kid-switcher" id="kid-switcher"></div>

<div class="content" id="content">
  <div class="loading-screen">加载中…</div>
</div>

<!-- 添加孩子弹窗 -->
<div class="modal-mask" id="add-kid-modal">
  <div class="modal">
    <div class="modal-title">添加新孩子</div>
    <div class="error-msg" id="add-kid-error"></div>
    <div class="field">
      <div class="field-label">选一个头像</div>
      <div class="avatar-grid" id="avatar-grid"></div>
    </div>
    <div class="field">
      <div class="field-label">孩子的名字</div>
      <input type="text" id="add-kid-name" placeholder="比如：明明" maxlength="20">
    </div>
    <div class="field">
      <div class="field-label">设置 4 位 PIN</div>
      <div class="pin-row">
        <input class="pin-box" data-idx="0" inputmode="numeric" maxlength="1" type="password">
        <input class="pin-box" data-idx="1" inputmode="numeric" maxlength="1" type="password">
        <input class="pin-box" data-idx="2" inputmode="numeric" maxlength="1" type="password">
        <input class="pin-box" data-idx="3" inputmode="numeric" maxlength="1" type="password">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddKidModal()">取消</button>
      <button class="btn-submit" onclick="submitAddKid()">添加</button>
    </div>
  </div>
</div>

<script>

async function switchKid(id) {
  currentChildId = id;

function showNoKidsHint() {

async function loadKidStats(childId) {
  const content = document.getElementById('content');

      </div>

    <div class="panel-card">

      <div class="trend-chart">
        <div class="trend-bars">

async function renderStageBlock(childId, settings) {
  const descEl = document.getElementById('stage-setting-desc');
  const area = document.getElementById('stage-gate-area');
  if (!descEl || !area) return;

  // 没初始化过：显示下拉选起点
  if (!settings.stageInitialized) {
    descEl.textContent = '首次设定可任选起点（根据线下测试结果）。设定后，只能通过通关测试 + 家长批准逐阶段推进。';
    area.innerHTML = `
      <select class="stage-select" data-key="currentStage" id="initial-stage-select">
        ${KIWI.STAGES.map(s => `
          <option value="${s.id}" ${settings.currentStage === s.id ? 'selected' : ''}>
            阶段 ${s.id} · ${s.name}（${s.months} · ${s.cefr} · 蓝思 ${s.lexile}）
          </option>
        `).join('')}
      </select>
      <a class="curriculum-link" href="curriculum.html?stage=${settings.currentStage || 1}" target="_blank">查看 18 个月完整学习计划 →</a>
      <div class="warn-tip">⚠️ 起始阶段只能设定一次（点保存生效），之后阶段只能按顺序推进。</div>
    `;
    return;
  }

  // 已初始化：显示当前阶段 + 通关门槛进度
  try {
    const gate = await KIWI.api('/api/stage-gate?child=' + encodeURIComponent(childId));
    const stage = KIWI.STAGES[gate.stageId - 1];
    descEl.innerHTML = `孩子当前在 <strong>阶段 ${gate.stageId} · ${stage.name}</strong>。阶段只能按顺序推进，孩子完成通关测试后家长批准即可进入下一阶段。`;

    const weakAreaLabels = { listening: '听力', reading: '阅读', speaking: '口语', writing: '写作' };

    // 补习提示
    let remediationCard = '';
    if (gate.remediation && gate.remediation.count > 0) {
      const wa = gate.remediation.currentWeakArea;
      const waLabel = weakAreaLabels[wa] || wa || '某项';
      remediationCard = `
        <div class="remediation-card ${gate.needsParentHelp ? 'remediation-urgent' : ''}">
          <div class="remediation-title">
            ${gate.needsParentHelp ? '⚠️' : '🔄'} 补习期 · 第 ${gate.remediation.count} 次
          </div>
          <div class="remediation-sub">
            上次测试未通过，系统识别的短板是 <strong>${waLabel}</strong>。建议孩子在 ${waLabel} 模块多加练习后再测一次。
            ${gate.needsParentHelp
              ? '<br><strong>已补习 ' + gate.remediation.count + ' 次，建议你直接陪孩子聊聊，看是基础问题还是阶段难度问题。</strong>'
              : ''}
          </div>
        </div>
      `;
    }

    area.innerHTML = `
      ${remediationCard}
      ${renderGateChecklist(gate)}
      ${gate.canAdvance ? `
        <div class="advance-card">
          <div class="advance-card-title">🎉 ${stage.name} 通关测试通过！</div>
          <div class="advance-card-sub">测试 ${gate.lastTest.passedCount} / ${gate.lastTest.total} 题合格（要求 ${gate.lastTest.required} 题）。可以推进到下一阶段。</div>
          <button class="advance-btn" onclick="approveAdvance('${childId}')">✅ 批准升入阶段 ${gate.stageId + 1}</button>
        </div>
      ` : ''}
      ${gate.needsParentHelp && !gate.canAdvance ? `
        <div class="advance-card" style="background:var(--sky-light);border-color:var(--sky)">
          <div class="advance-card-title" style="color:var(--sky)">🛟 紧急通道：强制升阶</div>
          <div class="advance-card-sub" style="color:var(--sky)">孩子已补习 ${gate.remediation.count} 次仍未通过。如果你判断孩子能力其实够了（比如线下测试结果好），可以强制升阶。</div>
          <button class="advance-btn" style="background:var(--sky)" onclick="forceAdvance('${childId}')">强制升入阶段 ${gate.stageId + 1}</button>
        </div>
      ` : ''}
      <a class="curriculum-link" href="curriculum.html?stage=${gate.stageId}" target="_blank">查看 18 个月完整学习计划 →</a>
    `;
  } catch (e) {
    area.innerHTML = `<div style="font-size:12px;color:var(--text-3)">加载阶段数据失败：${escHtml(e.message)}</div>`;
  }
}

function renderGateChecklist(gate) {
  const items = [
    { label: '🎧 听力训练', c: gate.checks.listening, unit: '次' },
    { label: '🎤 口语训练', c: gate.checks.speaking, unit: '次' },
    { label: '✏️ 写作训练', c: gate.checks.writing, unit: '篇' },
    { label: '📖 阅读训练', c: gate.checks.reading, unit: '篇' },
    { label: '🎯 听力准确率', c: gate.checks.listeningAcc, unit: '%' },
    { label: '📝 写作平均分', c: gate.checks.writingScore, unit: '' },
  ];
  return `
    <div class="gate-grid">
      ${items.map(it => {
        const cur = it.c.current === null ? '—' : (typeof it.c.current === 'number' ? Math.round(it.c.current * 10) / 10 : it.c.current);
        return `
          <div class="gate-item ${it.c.ok ? 'gate-ok' : ''}">
            <div class="gate-item-label">${it.c.ok ? '✓' : '○'} ${it.label}</div>
            <div class="gate-item-val">${cur}${it.unit} / ${it.c.required}${it.unit}</div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="gate-summary ${gate.canTakeTest ? 'gate-summary-ok' : 'gate-summary-pending'}">
      ${gate.canTakeTest
        ? `✓ 训练量和质量都达标，孩子可以参加通关测试`
        : `○ 训练量或质量未达标，孩子继续练习中（系统会持续追踪）`}
    </div>
  `;
}

/* ========== 原版书打卡 ========== */
async function loadAndRenderBookLog(childId) {
  const area = document.getElementById('booklog-area');
  if (!area) return;
  try {
    const r = await KIWI.api('/api/book-log?child=' + encodeURIComponent(childId));
    renderBookLog(childId, r.books || []);
  } catch (e) {
    area.innerHTML = `<div class="empty-msg">加载失败：${escHtml(e.message)}</div>`;
  }
}

function renderBookLog(childId, books) {
  const area = document.getElementById('booklog-area');
  const KIND_LABEL = { novel: '📕 小说', journal: '📰 杂志', article: '📄 短文' };
  const total = books.reduce((s, b) => s + (b.countAsArticles || 0), 0);
  const listHtml = books.length === 0
    ? '<div class="empty-msg">还没有打卡记录</div>'
    : `<div class="book-list">${books.map(b => `
        <div class="book-row">
          <div class="book-icon">${(KIND_LABEL[b.kind] || '📚').slice(0, 2)}</div>
          <div class="book-meta">
            <div class="book-title">${escHtml(b.title)}</div>
            <div class="book-sub">${escHtml(b.author || '佚名')}${b.lexile ? ' · ' + b.lexile + 'L' : ''} · ${new Date(b.finishedAt).toLocaleDateString()}</div>
          </div>
          <div class="book-count">+${b.countAsArticles} 篇</div>
          <button class="book-del" onclick="deleteBookLog('${childId}', '${b.id}', '${escHtml(b.title).replace(/'/g, "\\'")}')">✕</button>
        </div>`).join('')}</div>`;
  area.innerHTML = `
    ${listHtml}
    ${books.length > 0 ? `<div style="font-size:12px;color:var(--text-3);margin-bottom:10px">已读 ${books.length} 本 · 累计 ${total} 篇阅读量</div>` : ''}
    <button class="add-book-btn" onclick="showAddBookModal('${childId}')">+ 打卡一本读完的书</button>
  `;
}

function showAddBookModal(childId) {
  document.getElementById('book-modal-childId').value = childId;
  document.getElementById('book-modal-title').value = '';
  document.getElementById('book-modal-author').value = '';
  document.getElementById('book-modal-lexile').value = '';
  document.getElementById('book-modal-kind').value = 'novel';
  document.getElementById('book-modal-count').value = '5';
  // 默认显示推荐 tab
  switchBookTab('rec');
  document.getElementById('book-modal').classList.add('show');
  // 异步取当前孩子的阶段，按阶段渲染推荐书单
  loadRecBooksForChild(childId);
}

async function loadRecBooksForChild(childId) {
  let stage = 1;
  try {
    const r = await KIWI.api('/api/stage-gate?child=' + encodeURIComponent(childId));
    stage = r.stageId || 1;
  } catch {}
  document.getElementById('book-modal-stage').value = stage;
  document.getElementById('book-rec-stage-label').textContent = `阶段 ${stage} · ${KIWI.STAGES[stage-1].name}`;
  renderRecBookList(stage);
}

function renderRecBookList(stage) {
  const books = BOOK_RECOMMENDATIONS[stage] || [];
  const slot = document.getElementById('book-rec-list');
  if (!slot) return;
  slot.innerHTML = books.map((b, idx) => {
    const [title, author, lexile, award, blurb, why, count] = b;
    const awardHtml = award ? `<div class="book-rec-award">${AWARD_LABEL[award] || award}</div>` : '';
    return `
      <div class="book-rec-card" onclick="selectRecBook(${stage}, ${idx})">
        <div class="book-rec-top">
          <div class="book-rec-title">${escHtml(title)}</div>
          <div class="book-rec-lexile">${lexile}L · ${count}篇</div>
        </div>
        <div class="book-rec-author">${escHtml(author)}</div>
        ${awardHtml}
        <div class="book-rec-blurb">${escHtml(blurb)}</div>
        <div class="book-rec-why">💡 ${escHtml(why)}</div>
      </div>
    `;
  }).join('');
}

function selectRecBook(stage, idx) {
  const b = BOOK_RECOMMENDATIONS[stage][idx];
  const [title, author, lexile, award, blurb, why, count] = b;
  // 自动填入表单 + 切到手动 tab 让家长确认
  document.getElementById('book-modal-title').value = title;
  document.getElementById('book-modal-author').value = author;
  document.getElementById('book-modal-lexile').value = lexile;
  document.getElementById('book-modal-kind').value = 'novel';
  document.getElementById('book-modal-count').value = count;
  switchBookTab('manual');
}

function switchBookTab(tab) {
  document.querySelectorAll('.book-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('book-tab-rec').style.display = tab === 'rec' ? 'block' : 'none';
  document.getElementById('book-tab-manual').style.display = tab === 'manual' ? 'block' : 'none';
}

function closeBookModal(e) {
  if (e && e.target.id !== 'book-modal') return;
  document.getElementById('book-modal').classList.remove('show');
}

function onBookKindChange() {
  const kind = document.getElementById('book-modal-kind').value;
  // 切换 kind 时给出折算建议
  const def = kind === 'novel' ? 5 : (kind === 'journal' ? 2 : 1);
  document.getElementById('book-modal-count').value = def;
}

async function submitBookLog() {
  const childId = document.getElementById('book-modal-childId').value;
  const title = document.getElementById('book-modal-title').value.trim();
  const author = document.getElementById('book-modal-author').value.trim();
  const lexile = document.getElementById('book-modal-lexile').value.trim();
  const kind = document.getElementById('book-modal-kind').value;
  const countAsArticles = parseInt(document.getElementById('book-modal-count').value, 10);
  if (!title) { alert('请填写书名'); return; }
  if (!countAsArticles || countAsArticles < 1 || countAsArticles > 20) { alert('折算篇数 1-20'); return; }
  try {
    await KIWI.api('/api/book-log', {
      method: 'POST',
      body: JSON.stringify({ childId, title, author, lexile: lexile ? parseInt(lexile, 10) : null, kind, countAsArticles })
    });
    closeBookModal();
    await loadAndRenderBookLog(childId);
    // 也刷新通关进度，因为阅读 sessions 涨了
    await loadKidStats(childId);
  } catch (e) {
    alert('打卡失败：' + e.message);
  }
}

async function deleteBookLog(childId, bookId, bookTitle) {
  if (!confirm(`确认删除「${bookTitle}」的打卡记录？阅读量会相应减少。`)) return;
  try {
    await KIWI.api('/api/book-log', {
      method: 'DELETE',
      body: JSON.stringify({ childId, bookId })
    });
    await loadAndRenderBookLog(childId);
    await loadKidStats(childId);
  } catch (e) {
    alert('删除失败：' + e.message);
  }
}

async function approveAdvance(childId) {
  if (!confirm('确认升入下一阶段？此操作不可撤销。')) return;
  try {
    const r = await KIWI.api('/api/settings/advance-stage', {
      method: 'POST',
      body: JSON.stringify({ childId })
    });
    alert('✅ 已升入阶段 ' + r.newStage);
    await loadKidStats(childId);
  } catch (e) {
    alert('升阶失败：' + e.message);
  }
}

async function forceAdvance(childId) {
  if (!confirm('⚠️ 强制升阶：即使孩子未通过通关测试也升入下一阶段。此操作不可撤销，确认吗？')) return;
  try {
    const r = await KIWI.api('/api/settings/advance-stage', {
      method: 'POST',
      body: JSON.stringify({ childId, confirm: true })
    });
    alert('✅ 已强制升入阶段 ' + r.newStage);
    await loadKidStats(childId);
  } catch (e) {
    alert('强制升阶失败：' + e.message);
  }
}

async function saveSettings(childId) {
  const statusEl = document.getElementById('setting-status');
  const settings = {};
  // 卡片选项
  document.querySelectorAll('#settings-area .setting-options').forEach(group => {
    const key = group.dataset.key;
    const active = group.querySelector('.setting-opt.active');
    if (active) settings[key] = active.dataset.val;
  });
  // 下拉框（currentStage 等数值字段）
  document.querySelectorAll('#settings-area select[data-key]').forEach(sel => {
    settings[sel.dataset.key] = parseInt(sel.value, 10);
  });

  statusEl.textContent = '保存中…';
  statusEl.style.color = 'var(--text-3)';
  try {
    await KIWI.api('/api/settings', {
      method: 'POST',
      body: JSON.stringify({ childId, settings })
    });
    statusEl.textContent = '✓ 已保存';
    statusEl.style.color = 'var(--kiwi)';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  } catch (e) {
    statusEl.textContent = '失败：' + e.message;
    statusEl.style.color = 'var(--danger)';
  }
}

function labelOf(dateStr, isToday) {
  if (isToday) return '今天';
  const d = new Date(dateStr);
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return '周' + wk;
}

/* ===== 添加孩子弹窗 ===== */
function openAddKidModal() {
  const grid = document.getElementById('avatar-grid');
  grid.innerHTML = AVATARS.map(a =>
    `<button class="avatar-btn" data-avatar="${a}" onclick="pickAvatar(this)">${a}</button>`
  ).join('');
  selectedAvatar = null;
  document.getElementById('add-kid-name').value = '';
  document.querySelectorAll('#add-kid-modal .pin-box').forEach(b => b.value = '');
  document.getElementById('add-kid-error').classList.remove('show');
  document.getElementById('add-kid-modal').classList.add('show');
}
function closeAddKidModal() {
  document.getElementById('add-kid-modal').classList.remove('show');
}
function pickAvatar(btn) {
  document.querySelectorAll('#add-kid-modal .avatar-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedAvatar = btn.dataset.avatar;
}
async function submitAddKid() {
  const name = document.getElementById('add-kid-name').value.trim();
  const pin = Array.from(document.querySelectorAll('#add-kid-modal .pin-box')).map(b => b.value).join('');
  const err = document.getElementById('add-kid-error');
  err.classList.remove('show');
  if (!selectedAvatar) { err.textContent = '请选头像'; err.classList.add('show'); return; }
  if (!name) { err.textContent = '请填名字'; err.classList.add('show'); return; }
  if (pin.length !== 4) { err.textContent = '请设置4位PIN'; err.classList.add('show'); return; }

  try {
    const r = await KIWI.api('/api/auth/add-child', {
      method: 'POST',
      body: JSON.stringify({ name, avatar: selectedAvatar, pin })
    });
    // 刷新user信息
    currentUser = await KIWI.api('/api/auth/me');
    currentChildId = r.id;
    renderKidSwitcher();
    closeAddKidModal();
    await loadKidStats(r.id);
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
  }
}

/* 弹窗内 PIN 联动 */
document.querySelectorAll('#add-kid-modal .pin-box').forEach((box, idx, arr) => {
  box.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value && idx < arr.length - 1) arr[idx + 1].focus();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !e.target.value && idx > 0) arr[idx - 1].focus();
  });
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
