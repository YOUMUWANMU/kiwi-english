<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>读后测试 · Kiwi English</title>
<style>
  :root {
    --kiwi: #3d7a3a; --kiwi-dark: #2d5c2b; --kiwi-light: #e6f0e5;
    --bg: #faf9f6; --surface: #ffffff; --border: #e5e1d8;
    --text: #1a1a1a; --text-2: #4a4a4a; --text-3: #8a8a8a;
    --gold: #c8820a; --gold-light: #fff5e6;
    --danger: #c2453d;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .back-btn { font-size:22px; color:var(--text-2); text-decoration:none; cursor:pointer; }
  .topbar-title { flex:1; min-width:0; }
  .topbar-name { font-size:15px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-sub { font-size:11px; color:var(--text-3); margin-top:2px; }
  .container { max-width:680px; margin:0 auto; padding:18px 16px 80px; }

  /* 加载/出题 */
  .loading-card { text-align:center; padding:50px 20px; }
  .loading-emoji { font-size:48px; margin-bottom:14px; animation:bob 1.5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .loading-title { font-size:16px; font-weight:600; margin-bottom:6px; }
  .loading-sub { font-size:13px; color:var(--text-3); line-height:1.6; }

  /* 进度条 */
  .progress-bar { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:6px; display:flex; align-items:center; gap:8px; margin-bottom:18px; position:sticky; top:8px; z-index:10; }
  .progress-track { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--kiwi); transition:width 0.3s; }
  .progress-text { font-size:11px; color:var(--text-3); font-weight:500; padding-right:8px; flex-shrink:0; }

  /* 题目卡片 */
  .question-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:14px; }
  .question-type-tag { display:inline-block; font-size:10px; font-weight:600; padding:3px 10px; border-radius:10px; margin-bottom:10px; letter-spacing:0.04em; text-transform:uppercase; }
  .tag-choice { background:#e6f0e5; color:var(--kiwi-dark); }
  .tag-short  { background:#fff5e6; color:#a36807; }
  .tag-opinion{ background:#f0e8fb; color:#5d4a85; }
  .tag-vocab  { background:#e8f4fa; color:#2c6080; }
  .question-text { font-size:15px; line-height:1.55; color:var(--text); margin-bottom:14px; font-weight:500; }
  /* 选择题 */
  .options-list { display:flex; flex-direction:column; gap:8px; }
  .option-btn { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; cursor:pointer; font-family:inherit; font-size:14px; text-align:left; color:var(--text); transition:all 0.12s; }
  .option-btn:hover { background:white; border-color:var(--text-3); }
  .option-btn.selected { background:var(--kiwi-light); border-color:var(--kiwi); }
  .option-letter { font-weight:600; color:var(--text-3); flex-shrink:0; min-width:18px; }
  .option-btn.selected .option-letter { color:var(--kiwi); }
  .option-text { line-height:1.5; }
  /* 简答/观点/词汇 */
  .text-input { width:100%; min-height:90px; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px; font-family:inherit; font-size:14px; line-height:1.5; resize:vertical; background:var(--bg); }
  .text-input:focus { outline:none; border-color:var(--kiwi); background:white; }
  .text-input-hint { font-size:11px; color:var(--text-3); margin-top:6px; }

  /* 底部导航 */
  .nav-row { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; justify-content:center; }
  .nav-inner { max-width:680px; width:100%; display:flex; gap:10px; }
  .nav-btn { flex:1; padding:12px; border-radius:24px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; border:none; }
  .nav-btn-secondary { background:var(--bg); color:var(--text-2); border:1px solid var(--border); }
  .nav-btn-primary { background:var(--kiwi); color:white; }
  .nav-btn-primary:disabled { background:var(--text-3); cursor:not-allowed; }
  .nav-btn-primary:hover:not(:disabled) { background:var(--kiwi-dark); }

  /* 结果页 */
  .result-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px 20px; text-align:center; margin-bottom:16px; }
  .result-emoji { font-size:54px; margin-bottom:10px; }
  .result-score { font-size:42px; font-weight:700; color:var(--kiwi); }
  .result-score .total { font-size:20px; color:var(--text-3); font-weight:500; }
  .result-percent { font-size:14px; color:var(--text-2); margin-top:6px; }
  .result-feedback-list { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .result-feedback { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; text-align:left; }
  .result-q { font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px; }
  .result-answer { font-size:12px; color:var(--text-3); line-height:1.5; }
  .result-feedback-text { font-size:12px; color:var(--kiwi-dark); margin-top:6px; line-height:1.5; font-style:italic; }
  .result-correct-indicator { display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:600; margin-left:auto; }
  .indicator-ok   { background:var(--kiwi-light); color:var(--kiwi-dark); }
  .indicator-bad  { background:#fbe8e8; color:var(--danger); }
  .indicator-meh  { background:var(--gold-light); color:#a36807; }
  .result-row-head { display:flex; align-items:center; gap:6px; margin-bottom:4px; }

  .error-box { background:#fbe8e8; border:1px solid #f5c0c0; border-radius:10px; padding:14px; color:var(--danger); font-size:13px; line-height:1.6; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="reading.html">←</a>
  <div class="topbar-title">
    <div class="topbar-name" id="book-title">📝 读后测试</div>
    <div class="topbar-sub" id="book-sub">15 题 · 选择 + 简答 + 观点 + 词汇</div>
  </div>
</div>

<div class="container" id="container">
  <div class="loading-card">
    <div class="loading-emoji">📚</div>
    <div class="loading-title">加载中…</div>
  </div>
</div>

<script src="auth.js?v=3.4"></script>
<script>
const params = new URLSearchParams(window.location.search);
const bookId = params.get('bookId');
const bookTitleFromUrl = params.get('title') || '';

let questions = [];
let currentIdx = 0;
let userAnswers = [];

(async function init() {
  try {
    await KIWI.requireAuth('child');
    if (bookTitleFromUrl) document.getElementById('book-title').textContent = '📝 ' + bookTitleFromUrl;
    if (!bookId) {
      showError('缺少 bookId 参数');
      return;
    }
    await loadOrGenerateQuiz();
  } catch (e) {}
})();

async function loadOrGenerateQuiz() {
  const container = document.getElementById('container');
  // 先看有没有缓存
  try {
    const got = await KIWI.api('/api/book-quiz/get?bookId=' + encodeURIComponent(bookId));
    if (got.exists) {
      questions = got.questions;
      userAnswers = new Array(questions.length).fill(null);
      currentIdx = 0;
      renderCurrentQuestion();
      return;
    }
  } catch {}

  // 没缓存，调生成接口
  container.innerHTML = `
    <div class="loading-card">
      <div class="loading-emoji">🪄</div>
      <div class="loading-title">出题中…</div>
      <div class="loading-sub">AI 正在根据这本书生成 15 道题<br>约需 10-20 秒，请稍候</div>
    </div>
  `;
  try {
    const gen = await KIWI.api('/api/book-quiz/generate', {
      method: 'POST',
      body: JSON.stringify({ bookId })
    });
    questions = gen.questions;
    userAnswers = new Array(questions.length).fill(null);
    currentIdx = 0;
    renderCurrentQuestion();
  } catch (e) {
    showError('出题失败：' + e.message + '<br><br>请稍后重试。');
  }
}

function showError(msg) {
  document.getElementById('container').innerHTML = `
    <div class="error-box">${msg}</div>
    <div style="text-align:center;margin-top:16px"><a href="reading.html" style="color:var(--kiwi)">← 返回</a></div>
  `;
}

const TYPE_TAGS = {
  choice:  { label: 'Multiple Choice', cls: 'tag-choice' },
  short:   { label: 'Short Answer', cls: 'tag-short' },
  opinion: { label: 'Your Opinion', cls: 'tag-opinion' },
  vocab:   { label: 'Vocabulary', cls: 'tag-vocab' },
};

function renderCurrentQuestion() {
  const total = questions.length;
  const q = questions[currentIdx];
  if (!q) {
    renderReview();
    return;
  }
  const progress = ((currentIdx + 1) / total) * 100;
  const tag = TYPE_TAGS[q.type] || { label: q.type, cls: 'tag-choice' };
  const a = userAnswers[currentIdx];

  let bodyHtml = '';
  if (q.type === 'choice') {
    const letters = ['A', 'B', 'C', 'D'];
    bodyHtml = `
      <div class="options-list">
        ${q.options.map((opt, idx) => `
          <button class="option-btn ${a === idx ? 'selected' : ''}" onclick="selectOption(${idx})">
            <div class="option-letter">${letters[idx]}</div>
            <div class="option-text">${escHtml(opt)}</div>
          </button>
        `).join('')}
      </div>
    `;
  } else {
    const placeholder = q.type === 'opinion'
      ? 'Share your thoughts in 3-5 sentences...'
      : q.type === 'vocab'
        ? 'Explain in your own words...'
        : 'Answer in 2-3 sentences...';
    bodyHtml = `
      <textarea class="text-input" id="text-answer" placeholder="${placeholder}" oninput="onTextChange()">${a || ''}</textarea>
      <div class="text-input-hint">${q.type === 'opinion' ? '没有标准答案，说出你自己的想法就好' : q.type === 'vocab' ? '解释这个词在书中的含义即可' : '用英文 2-3 句话回答'}</div>
    `;
  }

  document.getElementById('container').innerHTML = `
    <div class="progress-bar">
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">${currentIdx + 1} / ${total}</div>
    </div>
    <div class="question-card">
      <span class="question-type-tag ${tag.cls}">${tag.label}</span>
      <div class="question-text">${escHtml(q.q)}</div>
      ${bodyHtml}
    </div>
    <div class="nav-row">
      <div class="nav-inner">
        <button class="nav-btn nav-btn-secondary" onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>← 上一题</button>
        <button class="nav-btn nav-btn-primary" id="next-btn" onclick="nextQuestion()" ${a == null || a === '' ? 'disabled' : ''}>
          ${currentIdx === total - 1 ? '提交答案' : '下一题 →'}
        </button>
      </div>
    </div>
  `;
}

function selectOption(idx) {
  userAnswers[currentIdx] = idx;
  document.getElementById('next-btn').disabled = false;
  document.querySelectorAll('.option-btn').forEach((el, i) => el.classList.toggle('selected', i === idx));
}

function onTextChange() {
  const v = document.getElementById('text-answer').value;
  userAnswers[currentIdx] = v;
  document.getElementById('next-btn').disabled = !v || v.trim().length < 3;
}

function prevQuestion() {
  if (currentIdx > 0) { currentIdx--; renderCurrentQuestion(); }
}

async function nextQuestion() {
  // 保存当前文本答案
  if (questions[currentIdx].type !== 'choice') {
    const ta = document.getElementById('text-answer');
    if (ta) userAnswers[currentIdx] = ta.value.trim();
  }
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    renderCurrentQuestion();
  } else {
    await submitQuiz();
  }
}

async function submitQuiz() {
  document.getElementById('container').innerHTML = `
    <div class="loading-card">
      <div class="loading-emoji">🤔</div>
      <div class="loading-title">批改中…</div>
      <div class="loading-sub">AI 老师正在批改你的答案<br>约需 5-10 秒</div>
    </div>
  `;
  try {
    const r = await KIWI.api('/api/book-quiz/submit', {
      method: 'POST',
      body: JSON.stringify({ bookId, answers: userAnswers })
    });
    renderResult(r);
  } catch (e) {
    showError('提交失败：' + e.message);
  }
}

function renderResult(result) {
  const pct = result.percentage;
  const emoji = pct >= 90 ? '🌟' : pct >= 75 ? '🎉' : pct >= 60 ? '👍' : '💪';
  const headline = pct >= 90 ? '太棒了！这本书你读得很透' : pct >= 75 ? '很好！理解到位' : pct >= 60 ? '还不错，还有提升空间' : '继续加油！再读一遍会更明白';

  const letters = ['A', 'B', 'C', 'D'];
  const feedbackList = result.results.map((r, idx) => {
    const q = questions[r.index];
    const correctChoice = result.answers[r.index]?.correctChoice;
    const sampleAnswer = result.answers[r.index]?.sampleAnswer;
    let indicator = '';
    let answerInfo = '';
    if (r.type === 'choice') {
      const indicatorCls = r.correct ? 'indicator-ok' : 'indicator-bad';
      indicator = `<span class="result-correct-indicator ${indicatorCls}">${r.correct ? '✓ 正确' : '✗ 错误'}</span>`;
      if (!r.correct && correctChoice != null) {
        answerInfo = `<div class="result-answer">正确答案：<strong>${letters[correctChoice]}. ${escHtml(q.options[correctChoice])}</strong></div>`;
      }
    } else {
      const score = r.score;
      const cls = score >= 8 ? 'indicator-ok' : score >= 5 ? 'indicator-meh' : 'indicator-bad';
      indicator = `<span class="result-correct-indicator ${cls}">${score}/10</span>`;
      if (sampleAnswer && score < 8) {
        answerInfo = `<div class="result-answer">参考答案：${escHtml(sampleAnswer)}</div>`;
      }
    }
    return `
      <div class="result-feedback">
        <div class="result-row-head">
          <div class="result-q">Q${r.index + 1}. ${escHtml(q.q)}</div>
          ${indicator}
        </div>
        ${answerInfo}
        ${r.feedback ? `<div class="result-feedback-text">💡 ${escHtml(r.feedback)}</div>` : ''}
      </div>
    `;
  }).join('');

  document.getElementById('container').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div style="font-size:15px;color:var(--text-2);margin-bottom:14px">${headline}</div>
      <div class="result-score">${result.score}<span class="total"> / ${result.total}</span></div>
      <div class="result-percent">正确率 ${pct}%</div>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--text-2);margin:18px 4px 8px">📋 每题详情</div>
    <div class="result-feedback-list">${feedbackList}</div>
    <div style="margin-top:24px;text-align:center">
      <a href="reading.html" style="color:var(--kiwi);font-size:14px;text-decoration:none">← 返回阅读</a>
    </div>
  `;
  document.querySelector('.nav-row')?.remove();
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
